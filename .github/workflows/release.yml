name: Publish release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish, such as v0.2.0
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Verify version and publish GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - name: Verify the tag matches pyproject.toml
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          [[ $TAG == "v$version" ]] || {
            echo "::error title=release::tag $TAG does not match version $version"
            exit 1
          }
      - name: Write release notes
        run: |
          # The release's own changelog section, up to the next heading.
          awk -v v="## ${TAG#v} (" 'index($0, v) == 1 {on=1; next} /^## /{on=0} on' CHANGELOG.md >"$RUNNER_TEMP/notes.md"
          [[ -s $RUNNER_TEMP/notes.md ]] || { echo "::error title=release::no CHANGELOG.md section for $TAG"; exit 1; }
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" --title "gitlab-runnerctl ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
