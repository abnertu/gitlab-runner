[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gitlab-runnerctl"
version = "0.2.0"
description = "Manage dedicated rootless GitLab Runner instances"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "nix-adapter>=0.8.0",
]

[project.scripts]
runnerctl = "runnerctl.cli:main_cli"

[tool.setuptools.package-data]
runnerctl = ["retirement.conf"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "RUF",
    "C901", "PLR0911", "PLR0912", "PLR0915",
    # Public modules, classes, methods and functions carry a docstring.
    "D100", "D101", "D102", "D103", "D104", "D106",
]
# The formatter owns line length.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Test names state the behavior they guard.
"tests/**" = ["D"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
