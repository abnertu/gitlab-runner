[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gitlab-runnerctl"
version = "0.1.0"
description = "Manage dedicated rootless GitLab Runner instances"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "nix-adapter>=0.7.0",
]

[project.scripts]
runnerctl = "runnerctl.cli:main_cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "RUF",
    "C901", "PLR0911", "PLR0912", "PLR0915",
]
# The formatter owns line length.
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Temporary: these functions are split in the readability refactor.
"src/runnerctl/model.py" = ["C901", "PLR0912", "PLR0915"]
"src/runnerctl/operations.py" = ["C901", "PLR0915"]
"tests/test_runnerctl.py" = ["PLR0915"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
