[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gitlab-runnerctl"
version = "0.1.0"
description = "Manage dedicated rootless GitLab Runner instances"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "nix-adapter",
]

[project.scripts]
runnerctl = "runnerctl:main_cli"

[tool.setuptools]
py-modules = ["runnerctl", "runner_config", "runner_model"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
# The formatter owns line length.
ignore = ["E501"]

[tool.pyright]
include = ["runnerctl.py", "runner_config.py", "runner_model.py", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
