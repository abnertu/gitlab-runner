[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gitlab-runnerctl"
version = "0.1.0"
description = "Manage dedicated rootless GitLab Runner instances"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "nix-adapter",
]

[project.scripts]
runnerctl = "runnerctl:main_cli"

[tool.setuptools]
py-modules = ["runnerctl", "runner_config", "runner_model"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pyright]
include = ["runnerctl.py", "runner_config.py", "runner_model.py"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
